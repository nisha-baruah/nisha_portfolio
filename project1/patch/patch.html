<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PATCH Method</title>
    <link rel="stylesheet" href="../get/get.css">
    <link rel="stylesheet" href="../../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <nav>
        <div class="container">
            <a href="../index.html" class="logo">Patch<span>Method</span></a>
        </div>
    </nav>

    <section class="patch-method">
        <div class="container">
            <h2>PATCH Method</h2>
            <p>The PATCH method is used to partially update existing data on the server.</p>
            <div class="implementation">
                <h3>Example: Updating Student Email via PATCH</h3>
                <form id="patchForm">
                    <label for="sid">Student ID:</label>
                    <input type="text" id="sid" name="sid" placeholder="Enter Student ID" required>

                    <label for="email">New Email:</label>
                    <input type="email" id="email" name="email" placeholder="Enter New Email" required>

                    <button type="submit" class="btn">Update Email</button>
                </form>
                <div id="result"></div>
            </div>
            <a href="../project1.html" class="btn">Back to Project 1</a>
        </div>
    </section>

    <script>
        document.getElementById("patchForm").addEventListener("submit", function(event) {
            event.preventDefault();

            let formData = {
                sid: document.getElementById("sid").value,
                email: document.getElementById("email").value
            };

            fetch("process_patch.php", {
                method: "PATCH",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.text())
            .then(data => {
                document.getElementById("result").innerHTML = `<p>${data}</p>`;
            })
            .catch(error => console.error("Error:", error));
        });
    </script>
</body>
</html>
