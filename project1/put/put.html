<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUT Method - File Upload</title>
    <link rel="stylesheet" href="../get/get.css">
    <link rel="stylesheet" href="../../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <h1>Upload a File Using PUT</h1>
    <form id="putForm">
        <label for="file">Choose a file:</label>
        <input type="file" id="file" name="file" required>
        <button type="submit">Upload</button>
    </form>
    <p id="result"></p>

    <script>
        document.getElementById('putForm').addEventListener('submit', function (e) {
            e.preventDefault(); // Prevent form submission

            const fileInput = document.getElementById('file');
            const file = fileInput.files[0];

            if (!file) {
                alert('Please select a file to upload.');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            fetch('process_put.php', {
                method: 'PUT',
                body: formData,
            })
                .then(response => response.text())
                .then(message => {
                    document.getElementById('result').innerText = message;
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('result').innerText = 'Error uploading file.';
                });
        });
    </script>
</body>
</html>
